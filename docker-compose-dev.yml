x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile-dev.dockerfile
  target: server

services:
  frontend:
    container_name: frontend_${APP_ENV:-dev}
    environment:
      VITE_APP_ENV: ${APP_ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile-dev.dockerfile
      target: client
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: package.json
    depends_on:
      backend:
        condition: service_healthy

  backend:
    container_name: backend_${APP_ENV:-dev}
    build: *backend-build
    image: aisysrev-backend:${APP_ENV:-dev}
    ports: 
      - "127.0.0.1:5678:5678"
      - "127.0.0.1:8090:8080"
    environment:
      PYTHONPATH: /app
      DEBUG: ${DEBUG:-false}
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      OIDC_CLIENT_ID: ${SP_REGISTERY_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${SP_REGISTERY_CLIENT_SECRET}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://login.helsinki.fi}
      OIDC_REDIRECT_URI: "https://localhost:3001/api/v1/auth/callback"
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:3001}
    volumes:
      - ./server/migrations:/app/migrations
      - pdf_data:/app/data/pdfs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 20s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - ./migrations/
            - ./server/migrations/
            - ./.venv/
            - ./server/.venv/
            - ./client
        - action: rebuild
          path: server/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg14@sha256:1091ea8f64f5ffe0954dc4c90f196e0cc6ab906566b884a9ff210f0d24b83d12
    container_name: postgres_${APP_ENV:-dev}
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database_dev
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    container_name: adminer_${APP_ENV:-dev}
    image: adminer:6.1.1@sha256:74f29c416e148b98305e84446a18db7cd2c1038264dec464359d36774ef080ce
    restart: always
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: redis_${APP_ENV:-dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    container_name: celery_${APP_ENV:-dev}
    build: *backend-build
    image: aisysrev-backend:${APP_ENV:-dev}
    command: ["/bin/sh", "/app/start-celery-dev.sh"]
    ports: ["127.0.0.1:5679:5679"]
    environment:
      PYTHONPATH: /app
      DEBUG: ${DEBUG:-false}
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - pdf_data:/app/data/pdfs

  flower:
    container_name: flower_${APP_ENV:-dev}
    build: *backend-build
    image: aisysrev-backend:${APP_ENV:-dev}
    command: /app/.venv/bin/celery -A src.worker flower --port=5555
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
      RUN_MIGRATIONS: false
    ports:
      - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  pdf_data:
