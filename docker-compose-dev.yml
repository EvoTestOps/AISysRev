services:
  frontend:
    container_name: frontend_${APP_ENV:-dev}
    environment:
      VITE_APP_ENV: ${APP_ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile-dev
      target: client
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: package.json
    depends_on:
      - backend

  backend:
    container_name: backend_${APP_ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile-dev
      target: server
    ports: 
      - "127.0.0.1:5678:5678"
      - "127.0.0.1:8090:8080"
    environment:
      PYTHONPATH: /app
      DEBUG: ${DEBUG:-false}
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      OIDC_CLIENT_ID: ${SP_REGISTERY_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${SP_REGISTERY_CLIENT_SECRET}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://login.helsinki.fi}
      OIDC_REDIRECT_URI: "https://localhost:3001/api/v1/auth/callback"
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:3001}
    volumes:
      - ./server/migrations:/app/migrations
      - pdf_data:/app/data/pdfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 20s
      retries: 3
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /app
          ignore:
            - ./migrations/
            - ./server/migrations/
            - ./.venv/
            - ./server/.venv/
            - ./client
        - action: rebuild
          path: server/pyproject.toml
    depends_on:
      - postgres
      - redis
      - celery

  postgres:
    image: postgres:alpine@sha256:fbe21607052bb5c298674f2fd8cf044a63aa3ddf50b81627f894f91f40f50bcb
    container_name: postgres_${APP_ENV:-dev}
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database_dev
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init-scripts:/docker-entrypoint-initdb.d

  adminer:
    container_name: adminer_${APP_ENV:-dev}
    image: adminer:5.3.0@sha256:6bc678e77abcd8c7f34133f4903a4be485ec38b17df3d40a845ee56af0fcb32a
    restart: always
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080

  redis:
    image: redis:7.4.5-alpine@sha256:0c0142c3cd69bc030ea09fecfa1c1c0c7d0e7d6081be6bb4957804f23d2cf57a
    container_name: redis_${APP_ENV:-dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  celery:
    container_name: celery_${APP_ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile-dev
      target: celery
    ports: ["127.0.0.1:5679:5679"]
    environment:
      PYTHONPATH: /app
      DEBUG: ${DEBUg:-false}
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
    depends_on:
      - redis
    volumes:
      - pdf_data:/app/data/pdfs

  flower:
    container_name: flower_${APP_ENV:-dev}
    build:
      context: .
      dockerfile: Dockerfile-dev
      target: server
    command: uv run celery -A src.worker flower --port=5555
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-dev}
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_${APP_ENV:-dev}:5432/your_database_${APP_ENV:-dev}"
      CELERY_BROKER_URL: redis://redis_${APP_ENV:-dev}:6379/0
      REDIS_URL: redis://redis_${APP_ENV:-dev}:6379/0
      RUN_MIGRATIONS: false
    ports:
      - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    depends_on:
      - redis
      - celery

volumes:
  postgres_data:
  redis_data:
  pdf_data:
