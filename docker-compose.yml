services:
  frontend:
    container_name: frontend_prod
    environment:
      VITE_APP_ENV: prod
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    ports:
      - "127.0.0.1:3000:9443"
      - "127.0.0.1:3080:9080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started

  backend:
    container_name: backend_prod
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports: ["127.0.0.1:5678:5678"] # Debug port
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
      RUN_MIGRATIONS: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    volumes:
      - pdf_data:/app/data/pdfs

  postgres:
    image: pgvector/pgvector:pg14@sha256:fb27b00a92028f4749bf18f3d31b18fc62510258326486fb8900653ab2701252
    container_name: postgres_prod
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database_prod
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    container_name: adminer_prod
    image: adminer:5.5.0@sha256:a1e730bf95a18f1d7c38b409ab58a39d57d07bdb090614b81f5c7b37c6021b96
    restart: always
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: redis_prod
    ports:
      - "127.0.0.1:6379:6379"
    volumes: 
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    container_name: celery_prod
    build:
      context: .
      dockerfile: Dockerfile
      target: celery
    ports: ["127.0.0.1:5679:5679"]
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - pdf_data:/app/data/pdfs

  flower:
    container_name: flower_prod
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    command: /app/.venv/bin/celery -A src.worker flower --port=5555
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
    ports:
      - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  pdf_data:
