x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  target: server

services:
  frontend:
    container_name: frontend_prod
    environment:
      VITE_APP_ENV: prod
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    ports:
      - "127.0.0.1:3000:9443"
      - "127.0.0.1:3080:9080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started

  backend:
    container_name: backend_prod
    build: *backend-build
    image: aisysrev-backend:prod
    ports: ["127.0.0.1:5678:5678"] # Debug port
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
      RUN_MIGRATIONS: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    volumes:
      - pdf_data:/app/data/pdfs

  postgres:
    image: pgvector/pgvector:pg14@sha256:1091ea8f64f5ffe0954dc4c90f196e0cc6ab906566b884a9ff210f0d24b83d12
    container_name: postgres_prod
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database_prod
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    container_name: adminer_prod
    image: adminer:5.5.1@sha256:e3a6b4942dd088a29cc8bbce22553429247c5c2b30b07d856ae49012b5c84a5b
    restart: always
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: redis_prod
    ports:
      - "127.0.0.1:6379:6379"
    volumes: 
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    container_name: celery_prod
    build: *backend-build
    image: aisysrev-backend:prod
    command: ["/bin/sh", "/app/start-celery.sh"]
    ports: ["127.0.0.1:5679:5679"]
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - pdf_data:/app/data/pdfs

  flower:
    container_name: flower_prod
    build: *backend-build
    image: aisysrev-backend:prod
    command: /app/.venv/bin/celery -A src.worker flower --port=5555
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
    ports:
      - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  pdf_data:
