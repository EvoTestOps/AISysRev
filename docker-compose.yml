x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  target: server

services:
  frontend:
    container_name: frontend_prod
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    environment:
      VITE_APP_ENV: prod
    build:
      context: .
      dockerfile: Dockerfile
      target: client
      args:
        VITE_LOCAL_ENV: ${LOCAL_ENV:-false}
    ports:
      - "127.0.0.1:3000:9443"
      - "127.0.0.1:3080:9080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: Caddy starts first. In local mode it shows a startup page
    # (see Caddyfile) until the backend answers.

  backend:
    container_name: backend_prod
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    build: *backend-build
    image: aisysrev-backend:prod
    ports: ["127.0.0.1:5678:5678"] # Debug port
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
      RUN_MIGRATIONS: true
      LOCAL_ENV: ${LOCAL_ENV:-false}
      FRONTEND_URL: https://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    volumes:
      - pdf_data:/app/data/pdfs

  postgres:
    image: pgvector/pgvector:pg14@sha256:1091ea8f64f5ffe0954dc4c90f196e0cc6ab906566b884a9ff210f0d24b83d12
    container_name: postgres_prod
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 1g }
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: your_username
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database_prod
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    container_name: adminer_prod
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    image: adminer:5.5.1@sha256:d4ce3a057bbc391168b0b88266b7904b06bd8f7797f9107b9cd9a561d8b7f66d
    restart: always
    ports:
      - 127.0.0.1:${ADMINER_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: redis_prod
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
    ports:
      - "127.0.0.1:6379:6379"
    volumes: 
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery:
    container_name: celery_prod
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    build: *backend-build
    image: aisysrev-backend:prod
    command: ["/bin/sh", "/app/start-celery.sh"]
    ports: ["127.0.0.1:5679:5679"]
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
      CELERY_CONCURRENCY: 4
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - pdf_data:/app/data/pdfs

  flower:
    container_name: flower_prod
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }
    build: *backend-build
    image: aisysrev-backend:prod
    command: /app/.venv/bin/celery -A src.worker flower --port=5555
    environment:
      PYTHONPATH: /app
      APP_ENV: prod
      SECRET_KEY: yoursecretkey
      DB_URL: "postgresql+asyncpg://your_username:your_password@postgres_prod:5432/your_database_prod"
      CELERY_BROKER_URL: redis://redis_prod:6379/0
      REDIS_URL: redis://redis_prod:6379/0
    ports:
      - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  pdf_data:
