apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aisysrev

resources:
  - ../../base
  - route.yaml

patches:
  # Images pushed by .github/workflows/build-staging.yml
  - target:
      kind: ImageStream
      name: aisysrev
    patch: |-
      - op: replace
        path: /spec/tags/0/from/name
        value: quay.io/tike/aisysrev:backend-staging
      - op: replace
        path: /spec/tags/1/from/name
        value: quay.io/tike/aisysrev:frontend-staging
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aisysrev-backend-dep
      spec:
        template:
          spec:
            containers:
              - name: aisysrev
                env:
                  - name: APP_ENV
                    value: staging
                  - name: FRONTEND_URL
                    value: https://aisysrev-staging.ext.ocp-test-0.k8s.it.helsinki.fi
                  - name: OIDC_REDIRECT_URI
                    value: https://aisysrev-staging.ext.ocp-test-0.k8s.it.helsinki.fi/api/v1/auth/callback
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aisysrev-celery-dep
      spec:
        template:
          spec:
            containers:
              - name: aisysrev
                env:
                  - name: APP_ENV
                    value: staging
