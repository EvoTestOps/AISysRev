apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared by staging and production. Anything that differs between them is
# patched in overlays/<env>/kustomization.yaml.
namespace: aisysrev

resources:
  - configmap.yaml
  - caddyfile-configmap.yaml
  - imagestream.yaml
  - redis-serviceaccount.yaml
  - volumeclaim.yaml
  - service.yaml
  - redis-dep.yaml
  - backend-dep.yaml
  - celery-dep.yaml
  - frontend-dep.yaml
