apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisysrev-redis-dep
  namespace: aisysrev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aisysrev-redis
  template:
    metadata:
      labels:
        app: aisysrev-redis
    spec:
      serviceAccountName: redis
      containers:
        - name: redis
          image: redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
              cpu: 100m
            requests:
              memory: 64Mi
              cpu: 50m
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: aisysrev-redis-pvc
