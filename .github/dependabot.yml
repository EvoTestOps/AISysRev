version: 2

updates:
  # Client (React/Vite/Playwright) npm dependencies
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      client-npm:
        patterns:
          - "*"
    ignore:
      # No major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Server (FastAPI/Celery) Python dependencies, managed with uv
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      server-python:
        patterns:
          - "*"
    ignore:
      # No major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images in Dockerfile and Dockerfile-dev.dockerfile, plus the image
  # references in the Kubernetes/OpenShift manifests. Images are pinned by
  # digest, so without this they would never be updated.
  - package-ecosystem: docker
    directories:
      - /
      - /manifests/staging
      - /manifests/production
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      docker-images:
        update-types: [minor, patch]
    ignore:
      # Locally built images referenced by the manifests, not on a registry
      - dependency-name: aisysrev
      # No major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images in docker-compose.yml and docker-compose-dev.yml (postgres, redis, adminer)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      compose-images:
        patterns:
          - "*"
    ignore:
      # No major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        update-types: [minor, patch]
    ignore:
      # No major version updates
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
