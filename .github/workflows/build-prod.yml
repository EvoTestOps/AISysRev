name: Build and push docker image (prod)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  run-tests:
    uses: ./.github/workflows/tests.yml

  build-push-backend:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PUSH_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            quay.io/tike/aisysrev:backend-production
            quay.io/tike/aisysrev:backend-production-${{ github.sha }}
            quay.io/tike/aisysrev:backend-${{ github.ref_name }}

  build-push-frontend:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PUSH_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: client
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            quay.io/tike/aisysrev:frontend-production
            quay.io/tike/aisysrev:frontend-production-${{ github.sha }}
            quay.io/tike/aisysrev:frontend-${{ github.ref_name }}
