name: Build and push docker image (staging)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    uses: ./.github/workflows/tests.yml

  build-push-backend:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PUSH_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            quay.io/tike/aisysrev:backend-staging
            quay.io/tike/aisysrev:backend-staging-${{ github.sha }}

  build-push-frontend:
    needs: run-tests
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PUSH_USERNAME }}
          password: ${{ secrets.QUAY_PUSH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: client
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            quay.io/tike/aisysrev:frontend-staging
            quay.io/tike/aisysrev:frontend-staging-${{ github.sha }}
