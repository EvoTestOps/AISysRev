name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  
jobs:
  lint-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Client - Cache node_modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Client - Install dependencies
        run: npm ci --cache ~/.npm
        working-directory: client
      - name: Client - Run ESLint
        run: npm run lint
        working-directory: client
  typecheck-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Client - Cache node_modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Client - Install dependencies
        run: npm ci --cache ~/.npm
        working-directory: client
      - name: Client - Run Typecheck
        run: npm run typecheck
        working-directory: client
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./server
      - name: Lint project
        run: uv run ruff check
        working-directory: ./server
  typecheck-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./server
      - name: Typecheck project
        run: make typecheck
        working-directory: ./server
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run backend tests
        run: make backend-unit
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./server
      - name: Run backend tests
        run: make backend-test
  build-client:
    runs-on: ubuntu-latest
    needs: [lint-client, typecheck-client, lint-server, typecheck-server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Client - Cache node_modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Client - Install dependencies
        run: npm ci --cache ~/.npm
        working-directory: client
      - name: Client - Build client
        run: npm run build
        working-directory: client
  e2e-test:
    runs-on: ubuntu-latest
    needs: build-client
    timeout-minutes: 60
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v5
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "server/.python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./server
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Client - Cache node_modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: node-modules-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Client - Install dependencies
        run: npm ci --cache ~/.npm
        working-directory: client
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: client
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: client
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
