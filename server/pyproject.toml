[project]
name = "server"
version = "1.0.0"
description = "AISysRev server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "celery[redis]>=5.6.3",
    "charset-normalizer>=3.5.1",
    "debugpy>=1.8.22",
    "fastapi[standard]>=0.141.1",
    "flower>=2.1.0",
    "httpx2>=2.13.0",
    "gwet-ac1",
    "krippendorff>=0.8.2",
    "itsdangerous>=2.2.0",
    "markupsafe>=3.0.3",
    "openai>=2.14.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai,openrouter,retries]>=2.44.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.3",
    "redis>=6.4.0",
    "ruff>=0.16.8",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
    "pypdf>=6.19.0",
    "langchain-text-splitters>=1.1.2",
    "boto3>=1.43.96",
    "pgvector>=0.5.0",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(epoch)s-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
path_separator = "os"
sqlalchemy.url = "postgresql+asyncpg://your_username:your_password@postgres:5432/your_database"

[[tool.alembic.loggers]]
keys = "root,sqlalchemy,alembic"

[[tool.alembic.handlers]]
keys = "console"

[[tool.alembic.formatters]]
keys = "generic"

[[tool.alembic.logger_root]]
level = "WARNING"
handlers = "console"

[[tool.alembic.logger_sqlalchemy]]
level = "WARNING"
qualname = "sqlalchemy.engine"

[[tool.alembic.logger_alembic]]
level = "INFO"
qualname = "alembic"

[[tool.alembic.handler_console]]
class = "StreamHandler"
args = "(sys.stderr,)"
level = "NOTSET"
formatter = "generic"

[[tool.alembic.formatter_generic]]
format = "%(levelname)-5.5s [%(name)s] %(message)s"
datefmt = "%H:%M:%S"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.uv.sources]
gwet-ac1 = { git = "https://github.com/EvoTestOps/gwet_ac1" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
