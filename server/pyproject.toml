[project]
name = "server"
version = "1.0.0"
description = "AISysRev server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "celery[redis]>=5.6.0",
    "charset-normalizer>=3.4.4",
    "debugpy>=1.8.19",
    "fastapi[standard]>=0.124.4",
    "flower>=2.0.1",
    "gwet-ac1",
    "krippendorff>=0.8.2",
    "itsdangerous>=2.2.0",
    "openai>=2.14.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[openai,openrouter,retries]>=1.52.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.2",
    "redis>=6.4.0",
    "ruff>=0.14.9",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.38.0",
    "pypdf>=6.14.2",
    "langchain-text-splitters>=1.1.2",
    "boto3>=1.43.67",
    "pgvector>=0.5.0",
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(epoch)s-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
path_separator = "os"
sqlalchemy.url = "postgresql+asyncpg://your_username:your_password@postgres:5432/your_database"

[[tool.alembic.loggers]]
keys = "root,sqlalchemy,alembic"

[[tool.alembic.handlers]]
keys = "console"

[[tool.alembic.formatters]]
keys = "generic"

[[tool.alembic.logger_root]]
level = "WARNING"
handlers = "console"

[[tool.alembic.logger_sqlalchemy]]
level = "WARNING"
qualname = "sqlalchemy.engine"

[[tool.alembic.logger_alembic]]
level = "INFO"
qualname = "alembic"

[[tool.alembic.handler_console]]
class = "StreamHandler"
args = "(sys.stderr,)"
level = "NOTSET"
formatter = "generic"

[[tool.alembic.formatter_generic]]
format = "%(levelname)-5.5s [%(name)s] %(message)s"
datefmt = "%H:%M:%S"

[tool.uv.sources]
gwet-ac1 = { git = "https://github.com/EvoTestOps/gwet_ac1" }
